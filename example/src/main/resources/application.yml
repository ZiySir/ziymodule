spring:
  application:
    name: example
  datasource:
    url: jdbc:h2:mem:example;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:init.sql
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  data:
    redis:
      multi:
        primary: default
        datasource:
          default:
            host: 127.0.0.1
            port: 6379

logging:
  level:
    org.hibernate.tool.hbm2ddl: DEBUG

server:
  port: 8080


module:
  security:
    sign:
      enabled: true
      timestamp-tolerance-seconds: 300
      nonce-ttl-seconds: 600
      pattern:
        - /api/*
    permit:
      - /login
    session:
      enabled: true
