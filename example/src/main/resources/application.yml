spring:
  application:
    name: example
  datasource:
    url: jdbc:h2:mem:example;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  level:
    org.hibernate.tool.hbm2ddl: DEBUG

server:
  port: 8080

module:
  security:
    sign:
      enabled: true
      timestamp-tolerance-seconds: 300
      nonce-ttl-seconds: 600
      pattern:
        - /api/*
